version: "3.8"

services:
  # ===== Portal ezflow (Next.js) =====
  portal:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      REDIS_URL: ${REDIS_URL}
      UPLOAD_DIR: /app/public/uploads
      EVOLUTION_API_URL: http://evolution:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY}
    volumes:
      - uploads:/app/public/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      evolution:
        condition: service_started
    networks:
      - ezflow-network

  # ===== PostgreSQL =====
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ezflow-network

  # ===== Redis =====
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redisdata:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - ezflow-network

  # ===== Evolution API (WhatsApp) =====
  evolution:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    environment:
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY}
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_DATABASE}?schema=evolution_api
      WEBHOOK_GLOBAL_URL: ${NEXTAUTH_URL}/api/webhooks/evolution
    ports:
      - "8181:8080"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - ezflow-network

volumes:
  pgdata:
  redisdata:
  uploads:

networks:
  ezflow-network:
    driver: bridge
